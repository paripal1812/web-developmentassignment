<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

</head>

<body>

    <h1>Student Registration Form</h1>

    <form action="#" method="post">

        <!-- Personal Information -->

        <fieldset>

            <legend>Personal Information</legend>

            <label for="name">
                Full Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <br><br>

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <br><br>

            <label for="phone">
                Phone:
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
            >

            <br><br>

            <label for="dob">
                Date of Birth:
            </label>

            <input
                type="date"
                id="dob"
                name="dob"
            >

            <br><br>

            <p>Gender:</p>

            <input
                type="radio"
                id="male"
                name="gender"
                value="male"
            >

            <label for="male">
                Male
            </label>

            <input
                type="radio"
                id="female"
                name="gender"
                value="female"
            >

            <label for="female">
                Female
            </label>

            <input
                type="radio"
                id="other"
                name="gender"
                value="other"
            >

            <label for="other">
                Other
            </label>

        </fieldset>

        <br>

        <!-- Academic Information -->

        <fieldset>

            <legend>Academic Information</legend>

            <label for="course">
                Select Course:
            </label>

            <select id="course" name="course">

                <option value="">
                    Select Course
                </option>

                <option value="bca-ai">
                    BCA Artificial Intelligence
                </option>

                <option value="bca">
                    BCA
                </option>

                <option value="bba">
                    BBA
                </option>

                <option value="bcom">
                    B.Com
                </option>

            </select>

            <br><br>

            <label for="year">
                Select Year:
            </label>

            <select id="year" name="year">

                <option value="first">
                    First Year
                </option>

                <option value="second">
                    Second Year
                </option>

                <option value="third">
                    Third Year
                </option>

            </select>

            <br><br>

            <label for="address">
                Address:
            </label>

            <br>

            <textarea
                id="address"
                name="address"
                rows="5"
                cols="40"
            ></textarea>

        </fieldset>

        <br>

        <button type="submit">
            Register
        </button>

        <button type="reset">
            Reset
        </button>

    </form>

</body>

</html>
